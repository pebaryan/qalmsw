[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qalmsw"
version = "0.0.1"
description = "Automated QA for scientific LaTeX writing using local LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["latex", "llm", "scientific-writing", "citations", "quality-assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "pylatexenc>=2.10",
    "openai>=1.40",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "scholarly>=1.7",
    "bibtexparser>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]
space = [
    "gradio>=6.0,<7",
]

[project.scripts]
qalmsw = "qalmsw.cli:app"

[project.urls]
Homepage = "https://github.com/pebaryan/qalmsw"
Repository = "https://github.com/pebaryan/qalmsw"
Issues = "https://github.com/pebaryan/qalmsw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qalmsw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/qalmsw/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/tests"]
pythonpath = ["."]
addopts = "-ra"
